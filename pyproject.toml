[project]
name = "shop-app"
version = "0.1.0"
description = "Lab 4 - Professional OOP and Type System in Python (Online Store System)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0"
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true